server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (matching _headers / Cloudflare Pages)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://plausible.thompsonblack.us; style-src 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; manifest-src 'self'; connect-src 'self' https: https://plausible.thompsonblack.us; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Gzip compression for text, code, fonts, and SVG
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Cache static assets with content hashes or fixed fonts
    location ~* \.(?:woff2|png|ico|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://plausible.thompsonblack.us; style-src 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; manifest-src 'self'; connect-src 'self' https: https://plausible.thompsonblack.us; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Route requests, serving index.html or 404
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
